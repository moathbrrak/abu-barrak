<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="sunset">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="اخايله">
<meta name="theme-color" content="#140f24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link rel="preconnect" href="https://api.rainviewer.com" crossorigin>
<link rel="preconnect" href="https://tilecache.rainviewer.com" crossorigin>
<link rel="preconnect" href="https://view.eumetsat.int" crossorigin>
<link rel="preconnect" href="https://tiles.maps.eox.at" crossorigin>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;400;600;700&display=swap" rel="stylesheet">
<title>اخايله – المطر والرادار</title>
<style>
  /* ======== الثيمات ======== */
  :root{
    --bg:#140f24; --glass:rgba(30,21,52,.88); --sheet:rgba(22,15,40,.97); --gb:rgba(255,255,255,.11);
    --card:rgba(255,255,255,.05); --card2:rgba(255,255,255,.08);
    --tx:#f4f0ff; --mut:#a59cc4; --acc:#ff7a59; --acc2:#a66bff; --acc-tx:#fff; --glow:rgba(255,122,89,.55);
    --rain:#5fb4ff; --warn:#ffb547; --bad:#ff5c7a; --ok:#58d68d;
    --top:calc(env(safe-area-inset-top) + 94px); --peek:300px;
  }
  [data-theme=green]{
    --bg:#0b140f; --glass:rgba(14,30,21,.88); --sheet:rgba(10,22,15,.97); --gb:rgba(255,255,255,.10);
    --tx:#eefbe9; --mut:#94ad9c; --acc:#b9f26b; --acc2:#3fbf7f; --acc-tx:#0b140f; --glow:rgba(185,242,107,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  body{font-family:"IBM Plex Sans Arabic",-apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;color:var(--tx);line-height:1.55;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  input,textarea{-webkit-user-select:text;user-select:text}
  button{font-family:inherit;color:inherit}
  .glass{background:var(--glass);border:1px solid var(--gb);box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .sub{color:var(--mut);font-size:12px}
  .spin{display:inline-block;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ======== الخريطة ======== */
  #map{position:fixed;inset:0;direction:ltr;touch-action:none;background:var(--bg)}
  .maplibregl-map{background:var(--bg)}
  .maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{bottom:var(--vis,var(--peek));transition:bottom .3s}
  .maplibregl-ctrl-attrib{font-size:9px;opacity:.6}
  .maplibregl-popup-content{direction:rtl;text-align:right;font-family:inherit;background:var(--sheet);color:var(--tx);border:1px solid var(--gb);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .maplibregl-popup-tip{border-top-color:var(--sheet)!important;border-bottom-color:var(--sheet)!important}
  .maplibregl-popup-content a.nav{display:inline-block;margin-top:6px;padding:5px 10px;border-radius:10px;background:var(--acc);color:var(--acc-tx);text-decoration:none;font-weight:600}
  .maplibregl-popup-close-button{color:var(--mut);font-size:18px;left:4px;right:auto}
  /* أسماء عربية على الخريطة */
  .ml{direction:rtl;white-space:nowrap;pointer-events:none;font-family:"IBM Plex Sans Arabic",sans-serif;text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.8)}
  .ml-c{font-size:14px;font-weight:600;color:rgba(255,255,255,.5);letter-spacing:1px}
  .ml-r{font-size:12px;font-weight:600;color:rgba(255,230,200,.55);letter-spacing:.5px}
  .ml-s{font-size:13px;font-weight:400;color:rgba(170,200,255,.6);letter-spacing:2px}
  .ml-k,.ml-t{display:flex;align-items:center;gap:4px;color:#fff}
  .ml-k{font-size:13px;font-weight:600}
  .ml-t{font-size:11.5px;font-weight:400;color:rgba(255,255,255,.88)}
  .ml-k::before,.ml-t::before{content:'';width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 4px #000}
  .ml-t::before{width:4px;height:4px;opacity:.8}
  .pill{background:var(--glass);color:#fff;border:1px solid var(--gb);border-radius:12px;padding:2px 8px;font:600 11px "IBM Plex Sans Arabic",sans-serif;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.4);display:flex;gap:6px;align-items:center;cursor:pointer;direction:rtl}
  .pill b{color:var(--acc);font-weight:700}
  .pill.cur{background:var(--acc);border-color:#fff;color:var(--acc-tx);box-shadow:0 0 16px var(--glow)}
  .pill.cur b{color:var(--acc-tx)}
  .me{width:16px;height:16px;border-radius:50%;background:#4da3ff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(77,163,255,.25)}

  /* ======== الشريط العلوي ======== */
  .hdr{position:fixed;z-index:20;top:calc(env(safe-area-inset-top) + 6px);left:10px;right:10px;display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:20px}
  .avatar{width:30px;height:30px;border-radius:10px;flex:none;box-shadow:0 0 0 2px var(--gb)}
  .cityb{flex:1;min-width:0;background:none;border:0;text-align:right;cursor:pointer;padding:0}
  .cityb b{display:block;font-size:15px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cityb b i{font-style:normal;font-size:12px;color:var(--mut);margin-inline-start:4px}
  .cityb span{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ib{flex:none;width:32px;height:32px;border-radius:11px;border:1px solid var(--gb);background:rgba(255,255,255,.06);font-size:14px;cursor:pointer;display:grid;place-items:center;padding:0}
  .ib:active,.vbtn:active,.sbtn:active{transform:scale(.94)}
  #refBtn{width:44px;height:34px;border-radius:12px;font-size:20px;background:var(--acc);border-color:var(--acc);color:var(--acc-tx);box-shadow:0 0 18px var(--glow)}
  .tabs{position:fixed;z-index:20;top:calc(env(safe-area-inset-top) + 52px);left:10px;right:10px;display:flex;padding:3px;border-radius:15px;gap:2px}
  .tabs button{flex:1;position:relative;border:0;background:none;border-radius:11px;padding:4px 4px;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer;transition:background .2s,color .2s}
  .tabs button.on{background:var(--acc);color:var(--acc-tx);box-shadow:0 0 14px var(--glow)}
  .badge{position:absolute;top:-3px;left:2px;min-width:14px;height:14px;border-radius:7px;background:var(--bad);color:#fff;font-size:9px;line-height:14px;padding:0 3px;display:none}
  .badge.show{display:block}

  /* ======== أزرار الطبقات (يمين) والتحكم (يسار): عمود زجاجي واحد بأيقونات خطية ======== */
  .vcol{position:fixed;z-index:15;top:calc(var(--top) + 10px);display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px;border-radius:22px}
  .vcol.r{right:10px} .vcol.l{left:10px}
  .vcol svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .vbtn{width:42px;height:46px;border:0;border-radius:16px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0;color:var(--mut);transition:background .2s,color .2s,box-shadow .2s}
  .vbtn span{font-size:9px;font-weight:600;line-height:1}
  .vbtn.on{background:var(--acc);color:var(--acc-tx);box-shadow:0 0 12px var(--glow)}
  .sbtn{width:36px;height:36px;border:0;border-radius:13px;background:none;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--tx)}
  .sbtn:hover,.vbtn:hover{background:rgba(255,255,255,.07)}
  .vbtn.on:hover{background:var(--acc)}
  .sep{display:block;width:20px;height:1px;background:var(--gb);margin:2px 0}

  /* ======== القائمة ⋯ ======== */
  .menu{display:none;position:fixed;z-index:50;top:calc(env(safe-area-inset-top) + 62px);left:10px;width:min(310px,calc(100vw - 20px));max-height:calc(100dvh - 140px);overflow:auto;border-radius:20px;padding:12px;background:var(--sheet)}
  .menu.show{display:block;animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
  .menu h4{font-size:12px;color:var(--mut);font-weight:600;margin:10px 4px 6px}
  .menu h4:first-child{margin-top:0}
  .mg{display:flex;flex-wrap:wrap;gap:6px}
  .mg button{background:var(--card2);border:1px solid var(--gb);border-radius:12px;padding:7px 11px;font-size:13px;cursor:pointer}
  .mg button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-tx)}
  .sw{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-inline-end:5px}

  .newobs{display:none;position:fixed;z-index:30;top:calc(var(--top) + 10px);left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.5);max-width:58vw;text-align:center}
  .hint{display:none;position:fixed;z-index:30;left:50%;transform:translateX(-50%);top:calc(var(--top) + 10px);padding:8px 14px;border-radius:14px;font-size:13px;max-width:58vw;text-align:center}
  .noteform{display:none;position:fixed;left:10px;right:10px;bottom:calc(var(--vis,var(--peek)) + 12px);z-index:40;border-radius:18px;padding:12px;background:var(--sheet)}
  .noteform.show{display:block}
  .noteform textarea{width:100%;margin:6px 0;background:var(--card2);color:var(--tx);border:1px solid var(--gb);border-radius:12px;padding:8px;font:inherit;font-size:16px}
  .row{display:flex;gap:8px}
  .btn{background:var(--card2);border:1px solid var(--gb);border-radius:12px;padding:9px 14px;font-size:14px;cursor:pointer}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-tx);font-weight:600}

  /* ======== اللوحة السفلية ======== */
  #sheet{position:fixed;z-index:30;left:0;right:0;bottom:0;height:calc(100vh - var(--top) - 4px);height:calc(100dvh - var(--top) - 4px);background:var(--sheet);border-top:1px solid var(--gb);border-radius:28px 28px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.5);transform:translateY(calc(100% - var(--peek)));transition:transform .34s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;max-width:640px;margin:0 auto}
  #sheet.full{transform:translateY(0)}
  #sheet.mini{transform:translateY(calc(100% - var(--mini,150px)))}
  #sheet.drag{transition:none}
  #sheetTop{padding:2px 14px 8px;touch-action:none;cursor:grab}
  .handle{cursor:pointer}
  .hwrap{display:flex;justify-content:center;padding:2px 0 4px}
  .handle{width:40px;height:4px;border-radius:3px;background:rgba(255,255,255,.22);margin:6px auto 4px}
  #sheetBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:2px 14px calc(env(safe-area-inset-bottom) + 24px)}
  /* الملخص */
  .ph{display:flex;align-items:center;gap:8px}
  .ph .pl{flex:1;min-width:0}
  .pcity{display:flex;align-items:center;gap:5px;font-size:13.5px;font-weight:600;color:var(--mut)}
  .pcity svg{width:12px;height:12px;fill:var(--acc)}
  .ptemp{font-size:40px;font-weight:200;line-height:1;letter-spacing:-1.5px;margin-top:0}
  .ptemp sup{font-size:.45em;font-weight:300;vertical-align:top;position:relative;top:.15em;color:var(--acc)}
  .pverd{font-size:12.5px;color:var(--tx);opacity:.92;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill2{flex:none;width:70px;text-align:center}
  .illo{width:70px;height:54px;filter:drop-shadow(0 6px 18px var(--glow))}
  .hl{font-size:11.5px;color:var(--mut);margin-top:-4px}
  .hl b{color:var(--tx);font-weight:600}
  .pchips{display:flex;gap:5px;margin-top:7px;overflow-x:auto;scrollbar-width:none}
  .pchips::-webkit-scrollbar{display:none}
  .pchips span{flex:none;display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--gb);border-radius:12px;padding:3px 9px;font-size:11.5px;color:var(--mut)}
  .pchips b{color:var(--tx);font-weight:600}
  .pchips .warn{background:rgba(255,92,122,.16);border-color:rgba(255,92,122,.5);color:#ffd0d9}
  .pchips .warn b{color:#fff}
  .days3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}
  .days3 div{background:var(--card);border:1px solid var(--gb);border-radius:12px;padding:3px 8px;display:grid;grid-template-columns:1fr auto;align-items:center;row-gap:1px;font-size:12px}
  .days3 div>i{text-align:left}
  .days3 div>span{text-align:left}
  .days3 div.on{border-color:var(--acc);background:rgba(255,255,255,.08)}
  .days3 i{font-style:normal;font-size:15px}
  .days3 b{font-weight:600;font-size:12px}
  .days3 small{color:var(--mut);font-size:11px}
  .days3 em{font-style:normal;color:var(--rain);font-size:10.5px}
  /* شريط الوقت */
  .tl{display:flex;align-items:center;gap:10px;margin-top:18px}
  .play{position:relative;flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-tx);font-size:13px;cursor:pointer;box-shadow:0 0 18px var(--glow)}
  .play::before{content:'';position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 62%,var(--acc) 100%);-webkit-mask:radial-gradient(closest-side,transparent 84%,#000 86%);mask:radial-gradient(closest-side,transparent 84%,#000 86%);animation:sp 3s linear infinite;opacity:.8}
  .play.on::before{animation-duration:.9s;opacity:1}
  .tlw{position:relative;flex:1;direction:ltr;height:24px}
  .tlw input{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer;--p:100%}
  .tlw input:focus{outline:none}
  .tlw input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--acc2),var(--acc)) 0 0/var(--p) 100% no-repeat,radial-gradient(circle,rgba(255,255,255,.38) 1.4px,transparent 2px) 0 50%/9px 6px repeat-x}
  .tlw input::-moz-range-track{height:6px;border-radius:3px;background:radial-gradient(circle,rgba(255,255,255,.38) 1.4px,transparent 2px) 0 50%/9px 6px repeat-x}
  .tlw input::-moz-range-progress{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
  .tlw input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--acc);margin-top:-6px;box-shadow:0 0 14px var(--glow)}
  .tlw input::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:5px solid var(--acc);box-shadow:0 0 14px var(--glow)}
  .bub{position:absolute;top:-20px;transform:translateX(-50%);background:var(--acc);color:var(--acc-tx);font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:9px;white-space:nowrap;pointer-events:none;direction:rtl}
  .bub::after{content:'';position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-bottom:0;border-top-color:var(--acc)}
  .tlrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--mut);margin-top:2px}
  .live{color:var(--ok);white-space:nowrap}
  .live::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-inline-end:5px;animation:pulse 1.6s ease-in-out infinite}
  .live.warn{color:var(--warn)}
  .live.off{color:var(--mut)} .live.off::before{animation:none}
  @keyframes pulse{50%{opacity:.25}}

  /* ======== البطاقات (داخل اللوحة) ======== */
  .card{background:var(--card);border:1px solid var(--gb);border-radius:20px;padding:14px;margin-bottom:10px}
  .ctitle{font-size:13px;color:var(--mut);font-weight:600;margin-bottom:8px}
  .story p{font-size:15.5px;line-height:1.7}
  .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
  .trio div{background:var(--card2);border-radius:14px;padding:8px;text-align:center}
  .trio i{font-style:normal;display:block}
  .trio span{display:block;font-size:11px;color:var(--mut)}
  .trio b{font-size:18px;font-weight:600}
  small{font-size:.62em;font-weight:400;color:var(--mut)}
  .grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  .grid4 div{background:var(--card2);border-radius:14px;padding:8px 10px}
  .grid4 b{display:block;font-size:17px;font-weight:600}
  .grid4 span{font-size:11px;color:var(--mut)}
  .alert{margin-top:8px;padding:8px 10px;border-radius:12px;background:rgba(255,92,122,.15);border:1px solid rgba(255,92,122,.4);font-size:13px}
  .hrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .hrow::-webkit-scrollbar{display:none}
  .hrow div{flex:none;width:56px;text-align:center;background:var(--card2);border-radius:16px;padding:8px 2px;font-size:11px;color:var(--mut)}
  .hrow div.cur{background:var(--acc);color:var(--acc-tx)}
  .hrow i{display:block;font-style:normal;font-size:20px;margin:2px 0}
  .hrow b{display:block;font-size:15px;color:var(--tx);font-weight:600}
  .hrow div.cur b{color:var(--acc-tx)}
  .hrow em{display:block;font-style:normal;color:var(--rain);font-size:10.5px;min-height:14px}
  .hrow div.cur em{color:var(--acc-tx)}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .tiles .card{margin:0}
  .tv{display:block;font-size:24px;font-weight:600}
  .ts{color:var(--mut);font-size:12px}
  .uvbar{height:6px;border-radius:3px;background:linear-gradient(90deg,#8e44ad,#e74c3c,#f39c12,#f1c40f,#2ecc71);position:relative;margin:4px 0 8px;direction:ltr}
  .uvbar i{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:#fff;transform:translateX(50%);box-shadow:0 0 6px #000}
  .wave{width:100%;height:16px}
  .wind{display:flex;gap:12px;align-items:center}
  .compass{width:118px;flex:none}
  .winfo{flex:1}
  .winfo p{font-size:14px;margin-bottom:6px}
  .kv{display:flex;justify-content:space-between;font-size:13px;border-top:1px solid var(--gb);padding:5px 0}
  .kv span{color:var(--mut)}
  .gauge{width:100%;max-width:300px;display:block;margin:auto}
  .acc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .acc div{background:var(--card2);border-radius:12px;padding:8px 4px;text-align:center}
  .acc b{display:block;font-size:17px;font-weight:600}
  .acc span{font-size:10.5px;color:var(--mut)}
  .model{margin-bottom:10px}
  .mh{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:13px}
  .mh span{color:var(--mut);font-size:11px}
  .mh em{font-style:normal;color:var(--mut);font-size:11.5px;margin-inline-start:auto}
  .bars{display:flex;align-items:flex-end;gap:1px;height:38px;margin-top:4px;direction:ltr}
  .bars i{flex:1;background:var(--rain);border-radius:2px 2px 0 0}
  .tl-lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);direction:ltr}
  .legend{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);direction:ltr;margin:4px 0 8px}
  .legend .g{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,#88ddee,#0099cc,#0077aa,#005588,#ffee00,#ffaa00,#ff4400,#c10000,#ffaaff,#ff77ff)}
  .ages{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .ages span{background:var(--card);border:1px solid var(--gb);border-radius:10px;padding:3px 8px;font-size:11.5px;color:var(--mut)}
  .ages b{color:var(--tx);font-weight:600}
  .ages .old{color:var(--warn)}
  .nitem{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--gb);font-size:14px}
  .nitem div{flex:1}
  .err{background:rgba(255,92,122,.15);border-color:rgba(255,92,122,.45);color:#ffd0d9}
  footer{color:var(--mut);font-size:10.5px;text-align:center;margin-top:8px}
  /* التوقعات */
  .seg{display:flex;background:var(--card2);border-radius:14px;padding:3px;margin-bottom:10px}
  .seg button{flex:1;border:0;background:none;padding:7px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--mut);cursor:pointer}
  .seg button.on{background:var(--acc);color:var(--acc-tx)}
  details.fr{border-bottom:1px solid var(--gb)}
  details.fr:last-child{border-bottom:0}
  details.fr summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 2px;cursor:pointer}
  details.fr summary::-webkit-details-marker{display:none}
  .fr .fn{width:68px;font-weight:600;font-size:14px}
  .fr .fi{font-size:22px;width:30px;text-align:center}
  .fr .fp{flex:1;font-size:12px;color:var(--rain)}

  .fr .chev{color:var(--mut);transition:transform .2s;font-size:12px}
  details.fr[open] .chev{transform:rotate(180deg)}
  .fx{padding:2px 2px 12px}
  .fx .kvs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .fx .kvs div{background:var(--card2);border-radius:12px;padding:6px 8px;font-size:11px;color:var(--mut)}
  .fx .kvs b{display:block;color:var(--tx);font-size:14px;font-weight:600}

  /* التنبيهات */
  .al{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:18px;margin-bottom:8px;background:var(--card);border:1px solid var(--gb)}
  .al i{font-style:normal;font-size:26px;line-height:1}
  .al b{display:block;font-size:14.5px}

  .al.l1{background:rgba(255,181,71,.11);border-color:rgba(255,181,71,.4)}

  .sbox{display:flex;gap:6px;margin-bottom:8px}

  .results div{padding:10px;border-bottom:1px solid var(--gb);cursor:pointer}
  .place{display:flex;align-items:center;gap:10px;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--gb);margin-bottom:8px;cursor:pointer}
  .place.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
  .place .pn{flex:1}
  .place .pn b{display:block;font-size:15px}
  .place .pi{font-size:24px}
  .place .pt{font-size:22px;font-weight:300}
  .place .x{border:0;background:none;color:var(--mut);font-size:16px;cursor:pointer;padding:4px 6px}
  .pane[hidden]{display:none}
  /* لمسة على الخريطة: الأيقونات تصير شفافة */
  .hdr,.tabs,.vcol{transition:opacity .3s ease}
  body.clean .hdr,body.clean .tabs,body.clean .vcol{opacity:.15}
  /* الساعات القادمة + التراكمي المتوقع */
  .hrow div{position:relative;padding-bottom:12px}
  .hrow u{position:absolute;left:8px;right:8px;bottom:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;text-decoration:none}
  .hrow u i{display:block;height:100%;width:var(--w);background:var(--rain);border-radius:2px;margin:0}
  .hrow div.cur u{background:rgba(0,0,0,.15)}
  .hrow em.mm{color:var(--rain);font-weight:600}
  .hrow div.cur em.mm{color:var(--acc-tx)}
  .tot{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
  .tot div{background:var(--card2);border-radius:14px;padding:8px;text-align:center}
  .tot b{display:block;font-size:19px;font-weight:600;color:var(--rain)}
  .tot span{font-size:10.5px;color:var(--mut)}
  .tot em{display:block;font-style:normal;font-size:10px;color:var(--mut)}
  .dacc{display:grid;grid-template-columns:54px 24px minmax(0,1fr) 46px;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--gb);font-size:13px}
  .dacc>i{font-style:normal;font-size:19px;text-align:center}
  .dacc .db{height:8px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden;direction:ltr}
  .dacc .db i{display:block;height:100%;background:linear-gradient(90deg,var(--rain),var(--acc2));border-radius:4px}
  .dacc .dm{font-size:10.5px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dacc .dv{text-align:center;white-space:nowrap;line-height:1.1}
  .dacc .dv b{color:var(--rain);font-size:15px}
  .dacc .dv small{display:block;font-size:11px}
  /* لما تنفتح اللوحة كاملة: الملخص يصغر عشان يبان المحتوى */
  #sheet.full .pchips,#sheet.full .days3,#sheet.mini .pchips,#sheet.mini .days3,#sheet.mini .hl{display:none}
  #sheet.full .ptemp{font-size:32px}
  #sheet.full .illo{width:56px;height:44px}
  #sheet.full .pill2{width:58px}
  #sheet.full .tl,#sheet.mini .tl{margin-top:16px}
  /* الوضع المصغّر: سطر واحد (المدينة + الحرارة) وشريط الوقت */
  #sheet.mini .pill2,#sheet.mini .pverd{display:none}
  #sheet.mini .pl{display:flex;align-items:center;justify-content:space-between;gap:10px}
  #sheet.mini .ptemp{font-size:26px;letter-spacing:-1px}
  #sheet.mini .tl{margin-top:14px}
  .ptemp,.illo,.pill2{transition:font-size .25s,width .25s,height .25s}
  @media (min-width:700px){ .hdr,.tabs{max-width:620px;margin:0 auto} }
</style>
</head>
<body>
<div id="map"></div>

<!-- الشريط العلوي -->
<div class="hdr glass">
  <img class="avatar" src="apple-touch-icon.png" alt="">
  <button class="cityb" id="cityBtn"><b><span id="hCity" style="display:inline">جدة</span><i>▾</i></b><span id="hSub">—</span></button>
  <button class="ib" id="searchBtn" title="بحث">🔍</button>
  <button class="ib" id="refBtn" title="تحديث">⟳</button>
  <button class="ib" id="moreBtn" title="المزيد">⋯</button>
</div>
<div class="tabs glass" id="tabs">
  <button data-t="now" class="on">الآن</button>

<!-- الطبقات (يمين) -->
<div class="vcol r glass" id="lyr"></div>
<!-- التحكم (يسار) -->
<div class="vcol l glass">
  <button class="sbtn" id="bLoc" title="موقعي"></button>
  <button class="sbtn" id="bZin" title="تكبير"></button>
  <button class="sbtn" id="bZout" title="تصغير"></button>
  <i class="sep"></i>
  <button class="sbtn" id="tShot" title="حفظ صورة الرصد"></button>
</div>
<div id="newObs" class="newobs"></div>
<div id="hint" class="hint glass"></div>

<div id="noteForm" class="noteform glass">
  <div class="sub" id="nfWhere"></div>

</div>

<!-- اللوحة السفلية -->
<div id="sheet">
  <div id="sheetTop">
    <div class="hwrap"><div class="handle" id="handle"></div></div>
    <div id="peek"><div class="sub"><span class="spin">⟳</span> جاري التحميل…</div></div>
    <div class="tl">
      <button class="play" id="rPlay">▶</button>
      <div class="tlw"><input type="range" id="rSlider" min="0" max="0" value="0"><span class="bub" id="rBub"><span id="rTime">—</span></span></div>
    </div>
    <div class="tlrow"><span id="tlSrc"></span><span class="live" id="live">مباشر</span></div>
  </div>
  <div id="sheetBody">
    <div class="pane" id="p-now">
      <div id="app"></div>
      <section class="card">
        <div class="ctitle">📡 شدة المطر وأعمار البيانات</div>
        <div class="legend"><span>خفيف</span><div class="g"></div><span>غزير / برد</span></div>
        <div class="ages" id="ages"></div>
        <div class="sub" id="rNote"></div>
      </section>
      <div class="card" id="notesList" style="display:none"></div>
      <footer>البيانات: Open-Meteo (ECMWF · GFS · ICON) · رادار RainViewer · أقمار EUMETSAT · خرائط EOX و OpenStreetMap</footer>
    </div>
    <div class="pane" id="p-fc" hidden><section class="card"><div class="seg" id="fcSeg"><button data-f="d" class="on">3 أيام</button><button data-f="h">24 ساعة</button></div><div id="fcBox"></div></section></div>
    <div class="pane" id="p-al" hidden><div id="alLive"></div><div id="alBox"></div><div class="sub" style="text-align:center;margin-top:6px">التنبيهات محسوبة من النماذج الثلاثة + القمر الصناعي لموقع المدينة المختارة</div></div>
    <div class="pane" id="p-pl" hidden>
      <div class="sbox"><input id="q" placeholder="ابحث عن مدينة أو قرية…" autocomplete="off"><button class="btn primary" id="qGo">بحث</button></div>
      <div class="results card" id="results" style="display:none;padding:4px 10px"></div>
      <button class="btn" id="gpsAdd" style="width:100%;margin-bottom:10px">📍 أضف موقعي الحالي</button>
      <div id="placesList"></div>
    </div>
  </div>
</div>

<script>
const MODELS = [
  {id:'ecmwf_ifs', name:'الأوروبي', short:'ECMWF 9km'},
  {id:'gfs_seamless', name:'الأمريكي', short:'GFS'},
  {id:'icon_seamless', name:'الألماني', short:'ICON'},
];
const DEFAULT_CITIES = [{name:'جدة', lat:21.5433, lon:39.1728, country:'السعودية'}];
const RAIN_MM = 0.2;   // أقل كمية بالساعة نعتبرها مطر
const ls = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let cities = ls.get('cities', DEFAULT_CITIES);
let cur = Math.max(0, Math.min(ls.get('cur',0), cities.length-1));
const $ = id => document.getElementById(id);
let lastData = null;

// ================= الثيم =================
const THEMES = {
  sunset:{name:'غروب', sw:'linear-gradient(135deg,#ff7a59,#a66bff)', bg:'#140f24', tint:'#4a1f7a', base:'dark'},
  green: {name:'أخضر', sw:'linear-gradient(135deg,#b9f26b,#1f7a4a)', bg:'#0b140f', tint:'#14482b', base:'terrain'},
};
let theme = THEMES[ls.get('theme','sunset')] ? ls.get('theme','sunset') : 'sunset';
function applyTheme(k, changeBase){
  theme = k; ls.set('theme', k);
  document.documentElement.dataset.theme = k;
  document.querySelector('meta[name=theme-color]').content = THEMES[k].bg;
  if(map && map.getLayer('tint')){
    map.setPaintProperty('tint','background-color', THEMES[k].tint); map.setPaintProperty('bg','background-color', THEMES[k].bg);
    if(changeBase) setBase(THEMES[k].base); else setTint();
  }
  renderMenu();
}
document.documentElement.dataset.theme = theme;
document.querySelector('meta[name=theme-color]').content = THEMES[theme].bg;

const WMO = c => {
  if(c==null) return ['❔','—'];
  if(c===0) return ['☀️','صافي'];
  if(c===1) return ['🌤️','غالباً صافي'];
  if(c===2) return ['⛅','غائم جزئياً'];
  if(c===3) return ['☁️','غائم'];
  if(c===45||c===48) return ['🌫️','ضباب'];
  if(c>=51&&c<=57) return ['🌦️','رذاذ'];
  if(c===61) return ['🌧️','مطر خفيف'];
  if(c===63) return ['🌧️','مطر متوسط'];
  if(c===65||c===67) return ['🌧️','مطر غزير'];
  if(c>=71&&c<=77) return ['🌨️','ثلج'];
  if(c===80) return ['🌦️','زخات خفيفة'];
  if(c===81) return ['🌧️','زخات متوسطة'];
  if(c===82) return ['⛈️','زخات غزيرة'];
  if(c===95) return ['⛈️','عاصفة رعدية'];
  if(c===96||c===99) return ['⛈️','رعد مع برد'];
  return ['🌥️','—'];
};
const fmtH = iso => new Date(iso).toLocaleString('ar-SA-u-nu-latn',{weekday:'short',hour:'numeric'});
const fmtHour = iso => new Date(iso).toLocaleTimeString('ar-SA-u-nu-latn',{hour:'numeric'});
const fmtClock = iso => new Date(iso).toLocaleTimeString('ar-SA-u-nu-latn',{hour:'numeric',minute:'2-digit'});
const dayName = iso => new Date(iso+'T12:00').toLocaleDateString('ar-SA-u-nu-latn',{weekday:'long'});
const r1 = x => x==null||isNaN(x)?'—':(Math.round(x*10)/10).toString();
const rnd = x => x==null?'—':Math.round(x);
const DIRS = ['شمال','شمال شرق','شرق','جنوب شرق','جنوب','جنوب غرب','غرب','شمال غرب'];
const dirName = deg => deg==null ? '—' : DIRS[Math.round(((deg%360)+360)%360/45)%8];
const uvWord = u => u==null?'—':u<3?'منخفض':u<6?'متوسط':u<8?'مرتفع':u<11?'مرتفع جداً':'شديد';
const DAY3 = ['اليوم','غداً','بعد غد'];
function moonInfo(){
  const syn = 29.530588853, ref = Date.UTC(2000,0,6,18,14);
  const age = (((Date.now()-ref)/864e5) % syn + syn) % syn;
  const toFull = ((syn/2 - age) % syn + syn) % syn;
  const names = ['محاق','هلال متزايد','تربيع أول','أحدب متزايد','بدر','أحدب متناقص','تربيع ثاني','هلال متناقص'];
  const icons = ['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
  const k = Math.round(age/syn*8)%8;
  return {name:names[k], icon:icons[k], toFull:Math.round(toFull)};
}
function wmoIcon(code, isDay){ let [ic] = WMO(code); if(isDay===0){ if(code===0) ic='🌙'; else if(code===1||code===2) ic='☁️'; } return ic; }

// رسمة الطقس الكبيرة (SVG) — شمس/قمر/سحاب/مطر/رعد
function illo(code, isDay){
  const night = isDay===0, c = code??2;
  const rain = (c>=51&&c<=67)||(c>=80&&c<=82), storm = c>=95, snow = c>=71&&c<=77, fog = c===45||c===48;
  const cloud = c>=2, heavy = c===3||rain||storm||snow||fog;
  const orbFill = night ? 'url(#gm)' : 'url(#gs)';
  let s = `<svg class="illo" viewBox="0 0 120 100"><defs>
    <radialGradient id="gs" cx=".4" cy=".35"><stop offset="0" stop-color="#fff3b0"/><stop offset=".55" stop-color="#ffc24a"/><stop offset="1" stop-color="#ff7a3c"/></radialGradient>
    <radialGradient id="gm" cx=".35" cy=".35"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9a8ff"/></radialGradient>
    <linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="${heavy?'#8f88b8':'#d9d4f2'}"/></linearGradient>
  </defs>`;
  if(!heavy || c===2){
    const [x,y,r] = cloud ? [76,34,19] : [60,48,28];
    s += night ? `<circle cx="${x}" cy="${y}" r="${r}" fill="${orbFill}"/><circle cx="${x+r*.45}" cy="${y-r*.35}" r="${r*.8}" fill="#1a1230" opacity=".0"/>`
               : `<circle cx="${x}" cy="${y}" r="${r+7}" fill="#ffb347" opacity=".18"/><circle cx="${x}" cy="${y}" r="${r}" fill="${orbFill}"/>`;
  }
  if(cloud) s += `<path d="M34 78 Q18 78 18 65 Q18 52 32 51 Q35 35 53 33 Q68 31 75 44 Q78 43 82 43 Q98 44 99 60 Q101 78 84 78 Z" fill="url(#gc)"/>`;
  if(rain) s += [36,52,68,84].map((x,i)=>`<line x1="${x}" y1="${84+(i%2)*3}" x2="${x-5}" y2="${96+(i%2)*3}" stroke="#5fb4ff" stroke-width="3.2" stroke-linecap="round"/>`).join('');
  if(storm) s += `<path d="M60 74 L48 92 L58 92 L52 104 L72 84 L61 84 L68 74 Z" fill="#ffd34d"/>`;
  if(snow) s += [38,56,74].map(x=>`<circle cx="${x}" cy="90" r="3.2" fill="#fff"/>`).join('');
  if(fog) s += [84,92].map(y=>`<line x1="24" y1="${y}" x2="96" y2="${y}" stroke="#d9d4f2" stroke-width="4" stroke-linecap="round" opacity=".7"/>`).join('');
  return s + '</svg>';
}
const IC = {
  rad:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6.5-6.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>',
  sat:'<svg viewBox="0 0 24 24"><path d="M7 15a4 4 0 0 1-.6-8 5.5 5.5 0 0 1 10.6 1.5A3.3 3.3 0 0 1 17 15z"/><path d="M8 18l-1 2.5M12 18l-1 2.5M16 18l-1 2.5"/></svg>',
  rdt:'<svg viewBox="0 0 24 24"><path d="M7 14a4 4 0 0 1-.6-8 5.5 5.5 0 0 1 10.6 1.5A3.3 3.3 0 0 1 17 14"/><path d="M12.5 11l-2.5 4.5h3.5L11 21"/></svg>',
  li:'<svg viewBox="0 0 24 24"><path d="M13.5 2.5L5 13.5h6l-1.5 8 8.5-11h-6z"/></svg>',
  loc:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
  zin:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  zout:'<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
  cam:'<svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg>',
  ok:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  wait:'<svg viewBox="0 0 24 24" class="spin"><path d="M12 3a9 9 0 1 0 9 9"/></svg>',
};
$('bLoc').innerHTML=IC.loc; $('bZin').innerHTML=IC.zin; $('bZout').innerHTML=IC.zout; $('tShot').innerHTML=IC.cam;
const PIN = '<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';

// ================= التبويبات =================
let pane = 'now';
function setPane(k){
  pane = k;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t===k));
  document.querySelectorAll('.pane').forEach(p=>p.hidden = p.id!=='p-'+k);
  $('sheetBody').scrollTop = 0;
  if(k==='pl') renderPlaces();
}
$('tabs').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  const k = b.dataset.t;
  if(k==='now'){ setPane('now'); openSheet(false); } else { setPane(k); openSheet(true); }
};
$('cityBtn').onclick = () => { setPane('pl'); openSheet(true); };
$('searchBtn').onclick = () => { setPane('pl'); openSheet(true); setTimeout(()=>$('q').focus(), 350); };
$('refBtn').onclick = () => { load(true); if(map) refreshNow(true); };

// ================= الأماكن =================
function selectCity(i){ cur = i; ls.set('cur',cur); setPane('now'); openSheet(false); load(); }
function renderPlaces(){
  $('placesList').innerHTML = cities.map((c,i)=>{
    const d = ls.get(`data_${c.lat}_${c.lon}`, null), cu = d?.best?.current || {};
    return `<div class="place ${i===cur?'on':''}" data-i="${i}"><span class="pi">${wmoIcon(cu.weather_code, cu.is_day)}</span>
      <div class="pn"><b>${c.name}</b><span class="sub">${c.country||''}${cu.relative_humidity_2m!=null?` · رطوبة ${cu.relative_humidity_2m}%`:''}</span></div>
      <span class="pt">${cu.temperature_2m!=null?Math.round(cu.temperature_2m)+'°':''}</span>
      ${cities.length>1?`<button class="x" data-del="${i}">✕</button>`:''}</div>`;
  }).join('');
}
$('placesList').onclick = e => {
  const del = e.target.closest('[data-del]');
  if(del){ e.stopPropagation(); const i=+del.dataset.del; cities.splice(i,1); if(cur>=cities.length) cur=cities.length-1; else if(i<cur) cur--; ls.set('cities',cities); ls.set('cur',cur); renderPlaces(); load(); return; }
  const p = e.target.closest('.place'); if(p) selectCity(+p.dataset.i);
};
$('qGo').onclick = search;
$('q').onkeydown = e => { if(e.key==='Enter') search(); };
$('gpsAdd').onclick = () => {
  if(!navigator.geolocation) return;

async function search(){
  const q = $('q').value.trim(); if(!q) return;
  const box = $('results'); box.style.display='block'; box.innerHTML='<div><span class="spin">⟳</span></div>';
  try{
    const j = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=ar&format=json`);
    if(!j.results||!j.results.length){ box.innerHTML='<div>ما لقيت نتائج</div>'; return; }
    box.innerHTML = j.results.map((x,i)=>`<div data-i="${i}">${x.name} <span class="sub">${x.admin1||''} ${x.country||''}</span></div>`).join('');
    box.onclick = e => { const d=e.target.closest('[data-i]'); if(!d) return; const x=j.results[+d.dataset.i];
      addCity({name:x.name, lat:x.latitude, lon:x.longitude, country:x.country||''}); };

function addCity(c){
  const i = cities.findIndex(x=>Math.abs(x.lat-c.lat)<0.01&&Math.abs(x.lon-c.lon)<0.01);
  if(i>=0) cur=i; else { cities.push(c); cur=cities.length-1; }
  ls.set('cities',cities); ls.set('cur',cur);
  $('results').style.display='none'; $('q').value='';
  selectCity(cur);
}

// طلب مع مهلة عشان ما يعلق التطبيق إذا الشبكة بطيئة
async function getJSON(url, ms=8000){
  const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), ms);
  try{
    const r = await fetch(url, {signal:ctl.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  }catch(e){ throw new Error(e.name==='AbortError' ? 'انتهت المهلة (الشبكة بطيئة)' : e.message); }
  finally{ clearTimeout(t); }
}

let loading = 0;
async function load(force){
  const c = cities[cur], my = ++loading;
  if(map) flyToCity();
  const key = `data_${c.lat}_${c.lon}`;
  const cached = ls.get(key,null);
  if(cached) render(cached, true);   // اعرض آخر نسخة فوراً
  else { $('hCity').textContent = c.name; $('peek').innerHTML='<div class="sub" style="padding:20px 0"><span class="spin">⟳</span> جاري التحميل…</div>'; setPeek(); }
  $('refBtn').innerHTML='<span class="spin">⟳</span>';
  const H='precipitation,precipitation_probability,cloud_cover,cape';
  const base=`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&timezone=auto`;
  // كل نموذج بطلب مستقل: لو واحد فشل أو تأخر، الباقي يطلع عادي
  const modelReqs = MODELS.map(m => getJSON(`${base}&hourly=${H}&models=${m.id}&forecast_days=3`)
    .then(j => ({id:m.id, j})).catch(err => ({id:m.id, err})));
  const bestReq = getJSON(`${base}&current=temperature_2m,relative_humidity_2m,is_day,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,precipitation,weather_code,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m`
    + `&hourly=precipitation,temperature_2m,weather_code,precipitation_probability,visibility,uv_index,is_day,relative_humidity_2m,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m`
    + `&past_days=1&daily=weather_code,precipitation_sum,precipitation_probability_max,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max&forecast_days=4`)
    .catch(err => ({err}));
  const [best, ...mods] = await Promise.all([bestReq, ...modelReqs]);
  if(my!==loading) return;
  const hourly = {time: null};
  const failed = [];
  for(const m of mods){
    if(m.err || !m.j.hourly){ failed.push(MODELS.find(x=>x.id===m.id).short); continue; }
    hourly.time = hourly.time || m.j.hourly.time;
    for(const [k,v] of Object.entries(m.j.hourly)) if(k!=='time') hourly[`${k}_${m.id}`] = v;
  }
  if(!hourly.time && best.err){
    const msg = navigator.onLine===false ? 'الجهاز غير متصل بالإنترنت' : (best.err.message||'');
    $('app').insertAdjacentHTML('afterbegin',`<div class="card err">تعذّر التحديث: ${msg}. ${cached?'المعروض آخر نسخة محفوظة.':''}</div>`);
  } else {
    const data = {models:{hourly}, best: best.err ? (cached?.best||{}) : best, at: Date.now(), failed};
    ls.set(key, data);
    if(cities[cur]===c) render(data, false);
  }
  $('refBtn').textContent='⟳';
}

function analyze(h, mid, startIdx){
  const g = v => h[`${v}_${mid}`] || [];
  const P=g('precipitation'), PP=g('precipitation_probability'), CAPE=g('cape'), CC=g('cloud_cover');
  const win = n => { let mm=0, first=null, hrs=0, maxP=null, thunder=false, maxRate=0;
    for(let i=startIdx;i<Math.min(startIdx+n,P.length);i++){
      const p=P[i]; if(p==null) continue;
      mm+=p; if(p>=RAIN_MM){hrs++; if(first===null) first=i;} if(p>maxRate) maxRate=p;
      if(PP[i]!=null) maxP=Math.max(maxP??0,PP[i]);
      if(CAPE[i]!=null && CAPE[i]>800 && p>=RAIN_MM) thunder=true;
    } return {mm, first, hrs, maxP, thunder, maxRate}; };
  const has = P.slice(startIdx).some(v=>v!=null);
  return {has, d24:win(24), d72:win(72), P, CC};
}

// التراكمي من بيانات النموذج المدمج (ساعات منتهية حتى الحين)
function accum(b){
  const h=b.hourly; if(!h||!h.time||!h.precipitation) return [['ساعة',null],['3 ساعات',null],['6 ساعات',null],['24 ساعة',null]];
  const now=Date.now(); let end=h.time.findIndex(t=>new Date(t).getTime()>now); if(end<0) end=h.time.length;
  const sum=n=>h.precipitation.slice(Math.max(0,end-n),end).reduce((a,v)=>a+(v||0),0);
  return [['ساعة',sum(1)],['3 ساعات',sum(3)],['6 ساعات',sum(6)],['24 ساعة',sum(24)]];
}
// تقدير القمر الصناعي: يجمع شدة المطر في النقطة من صورة كل 20 د لآخر 6 ساعات
const satAccCache = {};
let satTimesCache = null;
async function satTimes(ws,id,hours,stepMin){
  if(satTimesCache && Date.now()-satTimesCache.at<5*60e3 && satTimesCache.k===hours+'/'+stepMin) return satTimesCache.v;
  const t=await fetchText(`https://view.eumetsat.int/geoserver/${ws}/${id}/ows?service=WMS&version=1.3.0&request=GetCapabilities`);
  const dim=(t.match(/<Dimension[^>]*name="time"[^>]*>([^<]*)</)||[])[1]||'';
  const last=dim.split(',').pop().split('/'); const end=new Date(last.length===3?last[1]:last[0]).getTime();
  const out=[]; for(let x=end; x>end-hours*3600e3; x-=stepMin*60e3) out.unshift(new Date(x).toISOString());
  satTimesCache={at:Date.now(), k:hours+'/'+stepMin, v:out};
  return out;
}
async function pointRate(time,lat,lon){
  const d=0.05, u=`https://view.eumetsat.int/geoserver/wms?service=WMS&version=1.3.0&request=GetFeatureInfo&layers=mtg_fd:h40b&query_layers=mtg_fd:h40b&styles=&crs=EPSG:4326&bbox=${lat-d},${lon-d},${lat+d},${lon+d}&width=11&height=11&i=5&j=5&info_format=application/json&time=${time}`;
  const j=await getJSON(u,10000); const p=j.features?.[0]?.properties; return p? (p.Instantaneous_rain_rate||0) : null;
}
async function satAccum6h(lat,lon){
  const times=await satTimes('mtg_fd','h40b',6,20);
  const key=`${lat.toFixed(2)},${lon.toFixed(2)},${times.at(-1)}`;
  if(!satAccCache[key]) satAccCache[key] = (async()=>{
    const rates=new Array(times.length); let i=0;
    await Promise.all(Array.from({length:6},async()=>{ while(i<times.length){ const k=i++; try{rates[k]=await pointRate(times[k],lat,lon);}catch(e){rates[k]=null;} } }));
    const ok=rates.filter(v=>v!=null); const mm=ok.reduce((a,v)=>a+v*20/60,0);
    return {mm, now:rates[rates.length-1], n:ok.length, total:times.length, end:times.at(-1)};
  })();
  return satAccCache[key];
}
async function satAccumCity(c){
  let a; try{ a = await satAccum6h(c.lat,c.lon); }catch(e){ const el=$('satAcc'); if(el) el.textContent='🛰️ تقدير القمر الصناعي: تعذّر الجلب'; return; }
  if(cities[cur]!==c) return;
  const el=$('satAcc'); if(el) el.innerHTML = `🛰️ تقدير القمر الصناعي لآخر 6 ساعات: <b>${r1(a.mm)} مم</b> · الشدة الحين ${r1(a.now)} مم/س <span class="sub">(${a.n}/${a.total} صورة، آخرها ${ago(a.end)})</span>`;
  $('alLive').innerHTML = a.now>=0.3 ? `<div class="al l2"><i>🛰️</i><div><b>يمطر الحين على ${c.name} حسب القمر الصناعي</b><span>الشدة ${r1(a.now)} مم/س · تراكمي 6 ساعات ${r1(a.mm)} مم · ${ago(a.end)}</span></div></div>`
    : a.mm>=1 ? `<div class="al l1"><i>🛰️</i><div><b>نزل مطر خلال آخر 6 ساعات</b><span>تقدير القمر ${r1(a.mm)} مم · متوقف الحين</span></div></div>` : '';
  updateBadge();
}

// التنبيهات المحسوبة
function computeAlerts({res, n, rain72, bh, bd, hi, td, firstIso}){
  const A = [];
  const th24 = res.filter(m=>m.d24.thunder).length, th72 = res.filter(m=>m.d72.thunder).length;
  if(th24) A.push({lv:2, ic:'⛈️', t:'احتمال عواصف رعدية خلال 24 ساعة', d:`${th24} من ${n} نماذج تتوقع رعد (طاقة حمل عالية مع مطر)`});
  else if(th72) A.push({lv:1, ic:'⚡', t:'احتمال رعد خلال 3 أيام', d:`${th72} من ${n} نماذج`});
  const peak = Math.max(0, ...res.map(m=>m.d72.maxRate));
  const sums = (bd.precipitation_sum||[]).slice(td, td+3);
  const hd = sums.findIndex(v=>v>=10);
  if(peak>=8 || hd>=0) A.push({lv:2, ic:'🌊', t:'مطر غزير محتمل — انتبه للسيول والأودية', d:`ذروة متوقعة ${r1(peak)} مم/س${hd>=0?` · ${DAY3[hd]} ${r1(sums[hd])} مم`:''}`});
  else if(peak>=4) A.push({lv:1, ic:'🌧️', t:'زخات متوسطة إلى غزيرة', d:`ذروة متوقعة ${r1(peak)} مم/س`});
  const win = arr => (arr||[]).slice(hi, hi+24);
  const G = win(bh.wind_gusts_10m), gi = G.reduce((b,v,i)=>v!=null&&(b<0||v>G[b])?i:b, -1), gmax = gi>=0?G[gi]:0;
  if(gmax>=60) A.push({lv:2, ic:'💨', t:'رياح شديدة', d:`هبات حتى ${Math.round(gmax)} كم/س · ${fmtH(bh.time[hi+gi])}`});
  else if(gmax>=45) A.push({lv:1, ic:'🌬️', t:'هبات رياح نشطة (احتمال غبار)', d:`حتى ${Math.round(gmax)} كم/س · ${fmtH(bh.time[hi+gi])}`});
  const V = win(bh.visibility), vi = V.reduce((b,v,i)=>v!=null&&(b<0||v<V[b])?i:b, -1), vmin = vi>=0?V[vi]:99999;
  if(vmin<1000) A.push({lv:2, ic:'🌫️', t:'ضباب أو رؤية منخفضة جداً', d:`الرؤية قد تنزل إلى ${Math.round(vmin)} م · ${fmtH(bh.time[hi+vi])}`});
  else if(vmin<4000) A.push({lv:1, ic:'🌫️', t:'رؤية متدنية', d:`حوالي ${r1(vmin/1000)} كم · ${fmtH(bh.time[hi+vi])}`});
  const uvm = bd.uv_index_max?.[td];
  if(uvm>=8) A.push({lv:1, ic:'🕶️', t:'أشعة فوق بنفسجية '+uvWord(uvm), d:`المؤشر ${Math.round(uvm)} — تجنب الشمس وقت الظهر`});
  const tx = bd.temperature_2m_max?.[td];
  if(tx>=45) A.push({lv:1, ic:'🌡️', t:'حرارة شديدة', d:`العظمى ${Math.round(tx)}°`});
  A.push(firstIso ? {lv:0, ic:'🌦️', t:'أول مطر متوقع', d:`${fmtH(firstIso)} · ${rain72} من ${n} نماذج تتوقع مطر خلال 3 أيام`}
                  : {lv:0, ic:'☀️', t:'ما فيه مطر متوقع خلال 3 أيام', d:'النماذج الثلاثة متفقة على جو جاف'});
  return A.sort((a,b)=>b.lv-a.lv);
}

let baseKey = null, baseIds = [];
function rasterSrc(url, opt={}){ return {type:'raster', tiles:[url], tileSize:opt.tileSize||256, maxzoom:opt.maxzoom??17, attribution:opt.attr||''}; }
function addRaster(id, url, before, opt={}){

// ---------- سجل الرصد: 6 ساعات ----------
// الرادار المجاني يعطي آخر ساعتين بس، فالـ6 ساعات يكمّلها مطر القمر الصناعي (صورة كل 30 د)
const STEP = 10*60e3, HOURS = 6, SAT_STEP_MIN = 30;
let frames = [], satFrames = [], steps = [], fi = 0, timer = null;
const onMap = {rad:new Set(), sat:new Set()};
const r10 = t => Math.round(t/STEP)*STEP;
const rid = p => 'rad-'+p.replace(/[^a-z0-9]/gi,'');
const sid = t => 'sat-'+t.replace(/[^0-9]/g,'');

function buildSteps(keepEnd){
  const wasEnd = !steps.length || fi >= steps.length-1;
  const ends = [frames.length? frames.at(-1).time*1000 : 0, satFrames.length? new Date(satFrames.at(-1)).getTime() : 0];
  const end = r10(Math.max(...ends) || Date.now());
  steps = []; for(let t=end-HOURS*3600e3; t<=end; t+=STEP) steps.push(t);
  $('rSlider').max = steps.length-1;
  if(wasEnd || !keepEnd) fi = steps.length-1;
  show(Math.min(fi, steps.length-1));
}
function radAt(t){ const f = frames.find(f=>r10(f.time*1000)===t); return f ? f.path : null; }
function satAt(t){ let best=null; for(const s of satFrames){ if(new Date(s).getTime()<=t+60e3) best=s; } return best; }

function placeBubble(){
  const s = $('rSlider'), mx = +s.max, p = mx>0 ? +s.value/mx : 1, w = s.offsetWidth || 200, th = 18;
  $('rBub').style.left = (th/2 + p*(w-th)) + 'px';
  s.style.setProperty('--p', (th/2 + p*(w-th)) + 'px');
}
// ما نخلي على الخريطة إلا الإطار الحالي واللي بعده
function show(i){
  if(!steps.length || !map || !map.getLayer('a-rad')) return;
  fi = Math.max(0, Math.min(i, steps.length-1));
  const t = steps[fi], nt = steps[(fi+1) % steps.length];
  const rp = lyrOn.rad ? radAt(t) : null, sp = lyrOn.sat ? satAt(t) : null;
  const needR = new Set([rp, lyrOn.rad && timer ? radAt(nt) : null].filter(Boolean));
  const needS = new Set([sp, lyrOn.sat && timer ? satAt(nt) : null].filter(Boolean));
  for(const p of [...onMap.rad]) if(!needR.has(p)){ dropRaster(rid(p)); onMap.rad.delete(p); }
  for(const p of needR) if(!onMap.rad.has(p)){ addRaster(rid(p), `${rvHost}${p}/256/{z}/{x}/{y}/2/1_1.png`, 'a-rad', {maxzoom:7, opacity:0}); onMap.rad.add(p); }
  for(const p of onMap.rad) map.setPaintProperty(rid(p), 'raster-opacity', p===rp ? 0.8 : 0);
  for(const s of [...onMap.sat]) if(!needS.has(s)){ dropRaster(sid(s)); onMap.sat.delete(s); }
  for(const s of needS) if(!onMap.sat.has(s)){ addRaster(sid(s), wmsUrl('mtg_fd','h40b',s), 'a-sat', {tileSize:512, maxzoom:12, opacity:0, attr:'© EUMETSAT'}); onMap.sat.add(s); }
  for(const s of onMap.sat) map.setPaintProperty(sid(s), 'raster-opacity', s===sp ? LYR.sat.op : 0);

  $('rSlider').value = fi;
  const ag = Math.round((steps.at(-1)-t)/60000);
  $('rTime').textContent = ag ? new Date(t).toLocaleTimeString('ar-SA-u-nu-latn',{hour:'numeric',minute:'2-digit'}) : 'الحين ' + new Date(t).toLocaleTimeString('ar-SA-u-nu-latn',{hour:'numeric',minute:'2-digit'});
  placeBubble();
  $('tlSrc').textContent = `${ag? `قبل ${Math.floor(ag/60)? Math.floor(ag/60)+' س ':''}${ag%60? ag%60+' د':''}` : 'آخر رصد'} · ${rp?'📡 رادار':''}${rp&&sp?' + ':''}${sp?'🛰️ قمر':''}${!rp&&!sp?'ما فيه بيانات لهالوقت':''}${!rp&&lyrOn.rad&&ag>120?' (الرادار يحفظ ساعتين)':''}`;
}
function stopPlay(){ clearInterval(timer); timer=null; $('rPlay').textContent='▶'; $('rPlay').classList.remove('on'); if(map && steps.length) show(fi); }
$('rPlay').onclick = () => {
  if(timer){ stopPlay(); return; }
  $('rPlay').textContent='⏸'; $('rPlay').classList.add('on');
  if(fi>=steps.length-1) fi=0;
  timer = setInterval(()=>{ show(fi>=steps.length-1 ? 0 : fi+1); }, 700);
  show(fi);
};
$('rSlider').oninput = e => { stopPlay(); show(+e.target.value); };
window.addEventListener('resize', placeBubble);

// ---------- جلب البيانات ----------
// جلب نص مع مهلة: لو مصدر علّق ما يوقف الباقي
async function fetchText(url, ms=9000){
  const ctl = new AbortController(), t = setTimeout(()=>ctl.abort(), ms);
  try{ const r = await fetch(url, {signal:ctl.signal, cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.text(); }
  catch(e){ throw new Error(e.name==='AbortError' ? 'ما رد خلال 9 ثواني' : 'ما يرد'); }
  finally{ clearTimeout(t); }
}
async function capTime(ws,id){
  const t = await fetchText(`${EUM}${ws}/${id}/ows?service=WMS&version=1.3.0&request=GetCapabilities`);
  const dim = (t.match(/<Dimension[^>]*name="time"[^>]*>([^<]*)</)||[])[1] || '';
  const last = dim.split(',').pop().split('/'); return last.length===3 ? last[1] : last[0];
}
async function loadRadar(){
  const j = await getJSON('https://api.rainviewer.com/public/weather-maps.json?_='+Date.now());
  rvHost = j.host; radarAt = Date.now();
  const newest = j.radar.past.at(-1).time, had = frames.length ? frames.at(-1).time : 0;
  frames = j.radar.past;
  return had && newest>had ? newest : 0;
}
async function loadSatHistory(){
  const end = await capTime('mtg_fd','h40b');
  wmsTime.sat = end;
  const e = new Date(end).getTime(), out = [];
  for(let x=e; x>e-HOURS*3600e3-1; x-=SAT_STEP_MIN*60e3) out.unshift(new Date(x).toISOString());
  const had = satFrames.at(-1);
  satFrames = out;
  return had && had!==end ? end : 0;
}
// العواصف والبرق والسحب: نغيّر الصورة بس إذا نزل وقت جديد
async function loadOverlays(){
  await Promise.all(['rdt','li','ir'].map(async k=>{
    try{
      const t = await capTime(LYR[k].ws, LYR[k].id);
      const id = 'ov-'+k;
      if(!t || (wmsTime[k]===t && map.getLayer(id))) return;
      const url = wmsUrl(LYR[k].ws, LYR[k].id, t), src = map.getSource(id);
      if(src && src.setTiles) src.setTiles([url]);
      else addRaster(id, url, LYR[k].anchor, {tileSize:512, maxzoom:12, opacity:LYR[k].op, attr:'© EUMETSAT'});
      vis(id, lyrOn[k]);
      wmsTime[k] = t; delete srcErr[k];
    }catch(e){ srcErr[k] = e.message; }
  }));
}
let refreshing = 0;
const srcErr = {};   // المصادر اللي ما ردت في آخر فحص
async function refreshNow(first){
  if(!map) return;
  if(refreshing && Date.now()-refreshing < 45e3) return;   // لو فحص علّق أكثر من 45 ث نبدأ من جديد
  refreshing = Date.now();
  try{ await refreshInner(first); }catch(e){ console.warn('refresh', e); $('live').textContent='يعيد المحاولة بعد دقيقة'; }
  finally{ refreshing = 0; }
}
// نتأكد إن تعريف الخريطة جاهز بس (مو كل البلاطات)، ومع مهلة عشان ما يعلق أبداً
const styleReady = () => new Promise(r => {
  const ok = () => map.style && map.style._loaded;
  if(ok()) return r();
  const t0 = Date.now(), iv = setInterval(()=>{ if(ok() || Date.now()-t0 > 4000){ clearInterval(iv); r(); } }, 100);
});
async function refreshInner(first){
  if(mapReady) await mapReady;   // ما نبدأ قبل ما تجهز الخريطة
  await styleReady();
  $('live').textContent='يشيك…';
  // 1) الرادار أولاً ويظهر على طول بدون ما ينتظر الأقمار
  let newRad = 0;
  try{ newRad = await loadRadar(); delete srcErr.rad; }catch(e){ srcErr.rad = e.message; }
  if(first || newRad || !steps.length){ buildSteps(true); applyLyr(); }
  // 2) الأقمار والعواصف والبرق بالتوازي، وكل واحد بمهلة
  const [sat] = await Promise.allSettled([loadSatHistory(), loadOverlays()]);
  let newSat = 0;
  if(sat.status==='fulfilled'){ newSat = sat.value; delete srcErr.sat; } else srcErr.sat = sat.reason?.message || 'ما يرد';
  if(newSat || (first && satFrames.length)){ buildSteps(true); applyLyr(); } else renderAges();
  if(newRad || newSat){
    const t = new Date((newRad*1000)||newSat).toLocaleTimeString('ar-SA-u-nu-latn',{hour:'numeric',minute:'2-digit'});
    flash(`🔴 رصد جديد ${newRad?'📡 رادار':'🛰️ قمر'} · ${t}`);
  }
  const bad = Object.keys(srcErr).map(k=>LYR[k]?.name).filter(Boolean);
  $('live').textContent = `مباشر · فحص ${new Date().toLocaleTimeString('ar-SA-u-nu-latn',{hour:'numeric',minute:'2-digit'})}${bad.length?` · ⚠️ ما يرد: ${bad.join('، ')}`:''}`;
  $('live').classList.toggle('warn', !!bad.length);
}
function flash(msg){ const el=$('newObs'); el.textContent=msg; el.style.display='block'; clearTimeout(flash.t); flash.t=setTimeout(()=>el.style.display='none', 8000); try{navigator.vibrate&&navigator.vibrate(80)}catch(e){} }
let liveTimer = null;
function startLive(){ stopLive(); liveTimer = setInterval(()=>{ if(document.visibilityState==='visible' && !timer) refreshNow(); }, 60e3); $('live').classList.remove('off'); }
function stopLive(){ clearInterval(liveTimer); liveTimer=null; $('live').classList.add('off'); }

const ago = iso => { const m = Math.round((Date.now()-new Date(iso).getTime())/60000); return m<1?'الحين':m<60?`قبل ${m} د`:`قبل ${Math.floor(m/60)} س ${m%60} د`; };
function renderAges(){
  const items = [];
  if(lyrOn.rad && frames.length) items.push(['📡 الرادار', new Date(frames.at(-1).time*1000).toISOString(), 25]);
  for(const k of ['sat','rdt','li','ir']) if(lyrOn[k] && wmsTime[k]) items.push([LYR[k].long||LYR[k].name, wmsTime[k], LYR[k].every*3]);
  $('ages').innerHTML = items.map(([n,t,lim])=>{
    const m=(Date.now()-new Date(t).getTime())/60000;
    return `<span>${n}: <b class="${m>lim?'old':''}">${ago(t)}</b></span>`;
  }).join('') + Object.entries(srcErr).map(([k,e])=>`<span>${LYR[k]?.long||LYR[k]?.name||k}: <b class="old">${e} — يعيد المحاولة كل دقيقة</b></span>`).join('');
}

// ---------- إنشاء الخريطة ----------
function dot(color, size=14){ const d=document.createElement('div'); d.style.cssText=`width:${size}px;height:${size}px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 0 6px #000a`; return d; }
function createMap(c){
  map = new maplibregl.Map({
    container:'map', center:[c.lon,c.lat], zoom:5.2, maxZoom:17, minZoom:2,
    style:{version:8, sources:{}, layers:[{id:'bg', type:'background', paint:{'background-color':THEMES[theme].bg}}]},
    attributionControl:{compact:true}, preserveDrawingBuffer:false, renderWorldCopies:false, pixelRatio:Math.min(window.devicePixelRatio||1, 2),
    dragRotate:false, pitchWithRotate:false, touchPitch:false, fadeDuration:0,
  });
  map.touchZoomRotate.disableRotation();
  mapReady = new Promise(ok => map.on('load', ()=>{
    map.addLayer({id:'tint', type:'background', paint:{'background-color':THEMES[theme].tint, 'background-opacity':0}});
    ANCHORS.forEach(id => map.addLayer({id, type:'background', layout:{visibility:'none'}, paint:{'background-color':'#000'}}));
    map.addSource('sites', {type:'geojson', data:{type:'FeatureCollection', features:RADARS.map(([id,n,la,lo])=>({type:'Feature', properties:{id,n}, geometry:{type:'Point', coordinates:[lo,la]}}))}});
    map.addLayer({id:'sites', type:'circle', source:'sites', layout:{visibility:'none'}, paint:{'circle-radius':6,'circle-color':'#fff','circle-opacity':.25,'circle-stroke-color':'#fff','circle-stroke-width':1.5}}, 'a-labels');
    map.on('click','sites', e=>{ const p=e.features[0].properties; new maplibregl.Popup({offset:8}).setLngLat(e.lngLat).setHTML(`📡 رادار ${p.n} (${p.id})`).addTo(map); });
    labelMarks = LABELS.map(def=>({def, m:null}));
    // حدود مناطق المملكة: خط أسود تحت المطر عشان ما يغطيه، مع هالة خفيفة تبينه على الخلفية الداكنة
    fetch('regions.json').then(r=>r.json()).then(g=>{
      if(map.getSource('regions')) return;
      map.addSource('regions', {type:'geojson', data:g});
      map.addLayer({id:'reg-halo', type:'line', source:'regions', layout:{'line-join':'round','visibility':lyrOn.reg?'visible':'none'}, paint:{'line-color':'#fff','line-opacity':.16,'line-width':['interpolate',['linear'],['zoom'],3,2.6,7,4.5,11,6]}}, 'a-sat');
      map.addLayer({id:'reg-line', type:'line', source:'regions', layout:{'line-join':'round','visibility':lyrOn.reg?'visible':'none'}, paint:{'line-color':'#000','line-opacity':.75,'line-width':['interpolate',['linear'],['zoom'],3,1.3,7,2.5,11,3.5]}}, 'a-sat');
    }).catch(()=>{});
    setBase(ls.get('base', THEMES[theme].base));
    ok();
  }));
  map.on('zoomend', updateLabels);
  // لمسة = تحريك فقط · ضغط مطوّل (أو زر الفأرة اليمين) = التراكمي · في وضع الملاحظة: لمسة = ملاحظة
  // لمسة عادية على الخريطة = الأيقونات تصير شفافة (لمسة ثانية ترجعها)
  map.on('click', e => {
    if(noteMode){ startNote(e.lngLat); return; }
    if(lpFired){ lpFired = false; return; }
    const t = e.originalEvent && e.originalEvent.target;
    if(t && t.closest && t.closest('.maplibregl-marker,.maplibregl-popup')) return;
    document.body.classList.toggle('clean');
  });
  map.on('contextmenu', e => { lpFired = true; accumPopup(e.lngLat); setTimeout(()=>lpFired=false, 400); });
  let lp = null, lp0 = null; var lpFired = false;
  const cancelLP = () => { clearTimeout(lp); lp = null; };
  map.on('touchstart', e => { cancelLP(); if(e.points && e.points.length===1){ lp0 = e.point; lp = setTimeout(()=>{ lp=null; lpFired=true; accumPopup(e.lngLat); }, 600); } });
  map.on('touchmove', e => { if(lp && lp0 && Math.hypot(e.point.x-lp0.x, e.point.y-lp0.y) > 10) cancelLP(); });
  ['touchend','touchcancel','zoomstart'].forEach(ev => map.on(ev, cancelLP));
}
function flyToCity(anim){
  const c = cities[cur]; if(!map) return;
  const o = {center:[c.lon,c.lat], zoom:Math.max(map.getZoom(),5.2), padding:mapPad()};
  anim ? map.flyTo({...o, duration:700}) : map.jumpTo(o);
}

async function openRadar(){
  if(!window.maplibregl){
    $('rNote').textContent='جاري تحميل الخريطة…';
    try{ await loadMapLib(); }catch(e){ $('rNote').textContent='تعذّر تحميل مكتبة الخريطة — تأكد من الاتصال.'; return; }
  }
  if(!map){ createMap(cities[cur]); renderLyr(); }
  await mapReady;
  map.resize();
  flyToCity();
  renderPills(); renderNotes();
  $('rNote').textContent='👆 اسحب بإصبع وكبّر بإصبعين · اضغط مطوّل على أي مكان يعطيك التراكمي فيه · 📡 رادار RainViewer (آخر ساعتين) · 🛰️ أقمار EUMETSAT تكمّل لـ6 ساعات · يفحص كل دقيقة';
  await refreshNow(true);
  startLive();
}

$('bZin').onclick = () => map && map.zoomIn({duration:250});
$('bZout').onclick = () => map && map.zoomOut({duration:250});

// زر «خذني هنا»: يفتح قوقل ماب بالاتجاهات لنفس النقطة
const navLink = (la,lo) => `<a class="nav" href="https://www.google.com/maps/dir/?api=1&destination=${la.toFixed(5)},${lo.toFixed(5)}&travelmode=driving" target="_blank" rel="noopener">🧭 خذني هنا (قوقل ماب)</a>`;
// ---------- التراكمي بالضغط المطوّل ----------
let accPop = null;
async function accumPopup(ll){
  if(noteMode) return;
  try{ navigator.vibrate && navigator.vibrate(30); }catch(e){}
  if(accPop) accPop.remove();
  accPop = new maplibregl.Popup({offset:6, maxWidth:'260px'}).setLngLat(ll).setHTML('🌧️ يحسب التراكمي…').addTo(map);
  const p = accPop;
  try{
    const a = await satAccum6h(ll.lat, ll.lng);
    if(p.isOpen()) p.setHTML(`<b>🌧️ تراكمي آخر 6 ساعات</b><br>🛰️ ${r1(a.mm)} مم (تقدير القمر)<br>الشدة الحين: ${r1(a.now)} مم/س<br><span style="opacity:.6">${ll.lat.toFixed(3)}, ${ll.lng.toFixed(3)} · أقرب رادار: ${nearestRadar(ll.lat,ll.lng)[1]}</span><br>${navLink(ll.lat,ll.lng)}`);
  }catch(err){ if(p.isOpen()) p.setHTML('تعذّر حساب التراكمي هنا'); }
}

// ---------- الملاحظات (محفوظة في جهازك) ----------
let noteMode = false, pending = null, notes = ls.get('notes', []), noteMarks = [];
function setNoteMode(on){ noteMode = on; hint(on ? '📝 المس المكان اللي تبي تحط فيه الملاحظة' : ''); renderMenu(); }
function startNote(ll){
  pending = {lat:ll.lat, lon:ll.lng};
  $('nfWhere').textContent = `📍 ${ll.lat.toFixed(4)}, ${ll.lng.toFixed(4)}`;
  $('nfText').value=''; $('noteForm').classList.add('show'); $('nfText').focus();
}
$('nfCancel').onclick = () => { $('noteForm').classList.remove('show'); pending=null; setNoteMode(false); };
$('nfSave').onclick = () => {
  const text = $('nfText').value.trim(); if(!text || !pending) return;
  notes.push({id:Date.now(), lat:pending.lat, lon:pending.lon, text, at:new Date().toISOString()});
  ls.set('notes', notes); pending=null; $('noteForm').classList.remove('show');
  setNoteMode(false); renderNotes();
};
const esc = t => t.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtNote = n => new Date(n.at).toLocaleString('ar-SA-u-nu-latn',{dateStyle:'medium',timeStyle:'short'});
function renderNotes(){
  if(map){
    noteMarks.forEach(m=>m.remove());
    noteMarks = notes.map(n=>new maplibregl.Marker({element:dot('#ffb547',16)}).setLngLat([n.lon,n.lat])
      .setPopup(new maplibregl.Popup({offset:12}).setHTML(`<b>📝 ${esc(n.text)}</b><br><span style="opacity:.6">${fmtNote(n)}</span><br>${navLink(n.lat,n.lon)} · <a href="#" data-del="${n.id}" style="color:#ff5c7a">🗑️ حذف</a>`)).addTo(map));
  }
  $('notesList').innerHTML = notes.length ? '<div class="ctitle">🗒️ ملاحظاتي</div>' + notes.slice().reverse().map(n=>`<div class="nitem"><div><b>${esc(n.text)}</b><br><span class="sub">${fmtNote(n)}</span></div><button class="btn" data-go="${n.id}">📍</button><button class="btn" data-del="${n.id}">🗑️</button></div>`).join('') : '<span class="sub">ما فيه ملاحظات. من ⋯ اختر «📝 ملاحظة» وبعدها المس الخريطة.</span>';
}
function noteAction(e){
  const del = e.target.closest('[data-del]'), go = e.target.closest('[data-go]');
  if(del){ e.preventDefault(); notes = notes.filter(n=>n.id!=del.dataset.del); ls.set('notes',notes); renderNotes(); }
  if(go){ const n = notes.find(n=>n.id==go.dataset.go); if(n){ openSheet(false); map.flyTo({center:[n.lon,n.lat], zoom:Math.max(map.getZoom(),10), padding:mapPad(), duration:800}); } }
}
$('notesList').onclick = noteAction;
document.addEventListener('click', e=>{ if(e.target.closest('.maplibregl-popup')) noteAction(e); });

// ---------- حفظ صورة الرصد (باسم أقرب رادار) ----------
$('tShot').onclick = async () => {
  const btn = $('tShot'); if(!map) return; btn.innerHTML = IC.wait;
  try{
    await new Promise(r => map.loaded() ? r() : map.once('idle', r));
    const mc0 = map.getCanvas();
    // ننسخ الصورة لحظة الرسم (بدون preserveDrawingBuffer عشان الخريطة تكون أخف)
    const mc = await new Promise(res => { map.once('render', () => { const k=document.createElement('canvas'); k.width=mc0.width; k.height=mc0.height; k.getContext('2d').drawImage(mc0,0,0); k.clientW=mc0.clientWidth; k.clientH=mc0.clientHeight; res(k); }); map.triggerRepaint(); });
    const W = mc.clientW, H = mc.clientH, HEAD = 44, S = mc.width / W;
    const cv = document.createElement('canvas'); cv.width = mc.width; cv.height = mc.height + HEAD*S;
    const x = cv.getContext('2d'); x.scale(S,S);
    x.drawImage(mc, 0, HEAD, W, H);
    const pt = (la,lo) => { const p = map.project([lo,la]); return [p.x, p.y+HEAD]; };
    x.textAlign='center'; x.strokeStyle='#000'; x.lineWidth=3;
    // الأسماء العربية الظاهرة
    labelMarks.filter(L=>L.m).forEach(L=>{ const [nx,ny]=pt(L.def[1],L.def[2]); if(nx<0||nx>W||ny<HEAD||ny>H+HEAD) return; x.font=(L.def[3]==='c'?'600 14px':'12px')+' sans-serif'; x.fillStyle=L.def[3]==='c'?'rgba(255,255,255,.6)':'#fff'; x.strokeText(L.def[0],nx,ny-6); x.fillText(L.def[0],nx,ny-6); });
    const c = cities[cur]; let [cx,cy] = pt(c.lat,c.lon);
    const acc = getComputedStyle(document.documentElement).getPropertyValue('--acc').trim();
    x.fillStyle=acc; x.strokeStyle='#fff'; x.lineWidth=2; x.beginPath(); x.arc(cx,cy,6,0,7); x.fill(); x.stroke();
    x.font='bold 13px sans-serif'; x.fillStyle='#fff'; x.strokeStyle='#000'; x.lineWidth=3; x.strokeText(c.name,cx,cy-10); x.fillText(c.name,cx,cy-10);
    notes.forEach(n=>{ const [nx,ny]=pt(n.lat,n.lon); if(nx<0||nx>W||ny<HEAD||ny>H+HEAD) return; x.fillStyle='#ffb547'; x.strokeStyle='#fff'; x.lineWidth=2; x.beginPath(); x.arc(nx,ny,7,0,7); x.fill(); x.stroke(); x.fillStyle='#fff'; x.font='12px sans-serif'; x.fillText(n.text.slice(0,30), nx, ny-11); });
    const ctr = map.getCenter(), rd = nearestRadar(ctr.lat, ctr.lng), t = new Date(steps[fi]||Date.now());
    const stamp = t.toLocaleString('ar-SA-u-nu-latn',{dateStyle:'medium',timeStyle:'short'});
    x.fillStyle=THEMES[theme].bg; x.fillRect(0,0,W,HEAD); x.fillStyle='#fff'; x.font='bold 15px sans-serif'; x.textAlign='right'; x.direction='rtl';
    x.fillText(`📡 رادار ${rd[1]} (${rd[0]}) · ${stamp}`, W-10, 27);
    x.textAlign='left'; x.font='11px sans-serif'; x.fillStyle=acc; x.fillText('اخايله · RainViewer · EUMETSAT', 10, 27);
    const pad = n=>String(n).padStart(2,'0');
    const fname = `رادار-${rd[1]}-${rd[0]}-${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}_${pad(t.getHours())}-${pad(t.getMinutes())}.png`.replace(/\s+/g,'_');
    const blob = await new Promise((ok,no)=>{ try{ cv.toBlob(b=>b?ok(b):no(new Error('blob')), 'image/png'); }catch(e){ no(e); } });
    const file = new File([blob], fname, {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:fname}); }
    else { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000); }
    btn.innerHTML = IC.ok;
  }catch(e){ btn.innerHTML = e.name==='AbortError' ? IC.cam : '⚠️'; }
  setTimeout(()=>btn.innerHTML=IC.cam, 2500);
};

// ---------- اللوحة السفلية: 3 وضعيات (مصغّرة / متوسطة / كاملة) تسحبها بإصبعك ----------
const sheet = $('sheet');
let sheetSt = ['mini','mid'].includes(ls.get('sheetSt','mid')) ? ls.get('sheetSt','mid') : 'mid';
const ROOT = document.documentElement.style;
let PK = 280, MN = 150;
// نقيس ارتفاع الملخص في الوضعين (بدون حركة)
function setPeek(){
  const cls = sheet.className;
  sheet.classList.add('drag'); sheet.classList.remove('full','mini');
  PK = $('sheetTop').offsetHeight + 2;
  sheet.classList.add('mini');
  MN = $('sheetTop').offsetHeight + 2;
  sheet.className = cls;
  ROOT.setProperty('--peek', PK+'px'); ROOT.setProperty('--mini', MN+'px');
  ROOT.setProperty('--vis', (sheetSt==='mini'?MN:PK)+'px');
  requestAnimationFrame(placeBubble);
}
function setSheet(st){
  sheetSt = st;
  sheet.classList.toggle('full', st==='full'); sheet.classList.toggle('mini', st==='mini');
  if(st!=='full'){ ls.set('sheetSt', st); if(pane!=='now') setPane('now'); }
  ROOT.setProperty('--vis', (st==='mini'?MN:PK)+'px');
  requestAnimationFrame(placeBubble);
}
function openSheet(full){ setSheet(full ? 'full' : 'mid'); }
(function(){
  const top = $('sheetTop'), body = $('sheetBody');
  const H = () => sheet.offsetHeight;
  const posOf = st => st==='full' ? 0 : st==='mid' ? H()-PK : H()-MN;
  let y0=null, base=0, moved=false, t0=0, lastY=0, lastT=0, vel=0;
  function begin(y){ y0=y; t0=lastT=Date.now(); lastY=y; vel=0; moved=false; base=posOf(sheetSt); sheet.classList.add('drag'); }
  function move(y){
    const dy = y - y0; if(Math.abs(dy)>5) moved=true;
    const now = Date.now(); if(now>lastT){ vel = (y-lastY)/(now-lastT); lastY=y; lastT=now; }
    let p = base+dy; const mx = H()-MN;
    if(p<0) p = p/3; if(p>mx) p = mx + (p-mx)/3;   // مقاومة عند الأطراف
    sheet.style.transform = `translateY(${p}px)`;
    return p;
  }
  function finish(y){
    const p = base + (y - y0);
    sheet.classList.remove('drag'); sheet.style.transform='';
    const order = ['full','mid','mini'], k = order.indexOf(sheetSt);
    let st;
    if(!moved) st = sheetSt==='full' ? 'mid' : sheetSt==='mid' ? 'full' : 'mid';   // لمسة: تكبير/تصغير
    else if(Math.abs(vel) > 0.6) st = order[Math.max(0, Math.min(2, k + (vel>0?1:-1) * (Math.abs(vel)>2.2?2:1)))];
    else st = order.map(s=>[s, Math.abs(posOf(s)-p)]).sort((a,b)=>a[1]-b[1])[0][0];   // أقرب وضعية
    y0 = null; setSheet(st);
  }
  top.addEventListener('pointerdown', e => { if(e.target.closest('button,input')) return; begin(e.clientY); top.setPointerCapture(e.pointerId); });
  top.addEventListener('pointermove', e => { if(y0!==null) move(e.clientY); });
  top.addEventListener('pointerup', e => { if(y0!==null) finish(e.clientY); });
  top.addEventListener('pointercancel', e => { if(y0!==null) finish(e.clientY); });
  // لما تكون فوق محتوى اللوحة: اسحب لتحت ينزلها
  let by=null, bDrag=false;
  body.addEventListener('touchstart', e => { by = e.touches[0].clientY; bDrag=false; }, {passive:true});
  body.addEventListener('touchmove', e => {
    if(by===null) return; const y = e.touches[0].clientY;
    if(!bDrag && body.scrollTop<=0 && y-by>8){ bDrag=true; begin(by); }
    if(bDrag){ e.preventDefault(); move(y); }
  }, {passive:false});
  body.addEventListener('touchend', e => { if(bDrag) finish(e.changedTouches[0].clientY); by=null; bDrag=false; });
  window.addEventListener('resize', setPeek);
})();
function hint(msg){ const h=$('hint'); h.textContent=msg; h.style.display = msg?'block':'none'; }

// ---------- كبسولات المدن على الخريطة (الاسم + الحرارة) ----------
let pillMarks = [];
function renderPills(){
  if(!map || !window.maplibregl) return;
  pillMarks.forEach(m=>m.remove());
  pillMarks = cities.map((c,i)=>{
    const d = ls.get(`data_${c.lat}_${c.lon}`, null), t = d?.best?.current?.temperature_2m;
    const el = document.createElement('div'); el.className = 'pill' + (i===cur?' cur':'');
    el.innerHTML = `${c.name}${t!=null?` <b>${Math.round(t)}°</b>`:''}`;
    el.onclick = ev => { ev.stopPropagation(); if(i!==cur) selectCity(i); else { setPane('now'); openSheet(true); } };
    return new maplibregl.Marker({element:el, anchor:'bottom', offset:[0,-4]}).setLngLat([c.lon,c.lat]).addTo(map);
  });
  updateLabels();
}

document.querySelectorAll('.hdr,.tabs,.vcol').forEach(el=>el.addEventListener('pointerdown', ()=>document.body.classList.remove('clean'), true));

// تسجيل الـService Worker: يخلّي التطبيق يفتح بدون نت ويوصله التحديث على طول
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

renderLyr();
setPeek();
setSheet(sheetSt);
load();
openRadar();

});
